services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oku
      POSTGRES_PASSWORD: oku
      POSTGRES_DB: oku
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional. Only needed when STORAGE_DRIVER=s3 in apps/api/.env.
  # With STORAGE_DRIVER=disk (the default) recordings are kept under apps/api/data/.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oku
      MINIO_ROOT_PASSWORD: okuokuoku
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
